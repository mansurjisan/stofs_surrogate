# Ensemble forecast configuration

ensemble:
  n_members: 50
  forecast_hours: 48

# Perturbation settings
perturbations:
  wind:
    type: "gaussian"
    magnitude: 2.0  # m/s
    correlation_time: 6  # hours
  pressure:
    type: "gaussian"
    magnitude: 200  # Pa
    correlation_time: 12  # hours

# Station extraction
stations:
  - name: "Atlantic City"
    id: "8534720"
    lon: -74.4181
    lat: 39.3550
  - name: "Sandy Hook"
    id: "8531680"
    lon: -74.0092
    lat: 40.4669
  - name: "The Battery"
    id: "8518750"
    lon: -74.0142
    lat: 40.7003
  - name: "Lewes, DE"
    id: "8557380"
    lon: -75.1192
    lat: 38.7828
  - name: "Cape May"
    id: "8536110"
    lon: -74.9597
    lat: 38.9683

# Output
output:
  save_all_members: false
  save_statistics: true  # mean, std, percentiles
  percentiles: [5, 25, 50, 75, 95]

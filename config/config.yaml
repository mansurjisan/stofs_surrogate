# STOFS Surrogate Model Configuration
# =====================================

# Data settings
data:
  # For synthetic data testing
  use_synthetic: true
  synthetic:
    num_nodes: 2500
    num_samples: 500
    domain_size: [100000, 100000]  # meters
    include_velocity: true
    include_forcing: false

  # For real STOFS data
  mesh_path: "data/raw/fort.14"
  elevation_path: "data/raw/fort.63.nc"
  velocity_path: "data/raw/fort.64.nc"  # Optional

  # Forcing (optional)
  forcing:
    enabled: false
    wind_u_path: "data/raw/wind_u.nc"
    wind_v_path: "data/raw/wind_v.nc"
    pressure_path: "data/raw/pressure.nc"

  # Normalization
  normalize: true
  eta_scale: 3.0      # Max expected surge (m)
  vel_scale: 2.0      # Max expected velocity (m/s)

  # Data loading
  time_stride: 1       # Use every Nth timestep
  cache_data: true     # Cache in memory

  # Train/val split
  train_ratio: 0.8

# Model settings
model:
  type: "simple"       # "stofs_gnn" or "simple"

  # SimpleMeshGraphNet settings
  simple:
    hidden_dim: 64
    num_layers: 4

  # STOFSSurrogateGNN settings
  stofs_gnn:
    hidden_dim: 128
    num_layers: 8
    activation: "relu"   # relu, gelu, silu

# Training settings
training:
  batch_size: 8
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.00001
  grad_clip: 1.0
  grad_accumulation_steps: 1

  # Mixed precision (requires CUDA)
  mixed_precision: true

  # Checkpointing
  save_every: 25
  eval_every: 5
  early_stopping_patience: 20

  # Logging
  log_every: 20

# Hardware settings
hardware:
  device: "cuda"       # cuda or cpu
  num_workers: 0       # DataLoader workers

# Output settings
output:
  dir: "outputs"
  use_wandb: false
  wandb_project: "stofs-surrogate"

# Multi-event training (for production)
multi_event:
  enabled: false
  events:
    - name: "hurricane_example_1"
      elevation_path: "data/raw/events/event1/fort.63.nc"
      velocity_path: "data/raw/events/event1/fort.64.nc"
    - name: "hurricane_example_2"
      elevation_path: "data/raw/events/event2/fort.63.nc"
      velocity_path: "data/raw/events/event2/fort.64.nc"
